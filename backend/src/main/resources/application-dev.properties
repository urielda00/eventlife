# Safe local-development defaults. Flyway still owns the schema in development.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventlife}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:eventlife_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:eventlife_dev}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# Development-only defaults. Production must provide APP_JWT_SECRET explicitly.
app.jwt.secret=${APP_JWT_SECRET:eventlife-local-development-secret-32-bytes-minimum}
app.jwt.expiration=${APP_JWT_EXPIRATION:600000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
