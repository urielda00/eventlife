# Production has no development fallbacks: deployment must provide these values.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Flyway owns schema creation and Hibernate verifies the resulting schema.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

# Honor Forwarded and X-Forwarded-* headers supplied by Cloudflare Tunnel.
server.forward-headers-strategy=framework
