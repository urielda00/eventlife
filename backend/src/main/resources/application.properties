# App Info
spring.application.name=EventLife
spring.profiles.default=dev

# PostgreSQL (required outside the dev profile)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema creation; Hibernate only validates it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Server
server.port=${SERVER_PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# Expose only the aggregate health endpoint. The JDBC health contributor makes
# the endpoint fail when PostgreSQL is unavailable without leaking DB details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=true

# Security (APP_JWT_SECRET and APP_CORS_ALLOWED_ORIGINS are required outside dev)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:600000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
